[package]
name = "pwd-app"
version.workspace = true
edition.workspace = true

[lib]
name = "pwd_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
data-encoding = "2"
dirs = "6"
pwd-core = { path = "../../crates/core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots-no-provider"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
zxcvbn = "3"
minisign-verify = "0.3.0"
sha1 = "0.10"
webpki-roots = "1"
rqrr = "0.11"
tauri-plugin-notification = "2"

# Tray only on Windows: on Linux it needs libayatana-appindicator, which not every desktop has.
[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[dev-dependencies]
axum-server = "0.7"
pwd-server = { path = "../../crates/server" }
qrcode = { version = "0.14", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
